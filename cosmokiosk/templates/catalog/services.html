<!DOCTYPE html>
<html>
<head>
      <meta charset="UTF-8">

      {% load static %}

      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <title>Survey Form</title>
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <link rel="stylesheet" href="{% static 'css/services.css' %}">


</head>

<body>

<h1>What are you getting done today</h1>

<form method="POST" onsubmit="return checkServices(event)">

    {% csrf_token %}


<label class="container">Perm
  <input type="checkbox" name="perm" id="perm">
  <span class="checkmark"></span>
</label>

<label class="container">Color
  <input type="checkbox" name="color" id="color">
  <span class="checkmark"></span>
</label>

<label class="container">Hairstyle
  <input type="checkbox" name="hairstyle" id="hairstyle">
  <span class="checkmark"></span>
</label>

<label class="container">Waxing
  <input type="checkbox" name="waxing" id="waxing">
  <span class="checkmark"></span>
</label>

<label class="container">Nails
  <input type="checkbox" name="nails" id="nails">
  <span class="checkmark"></span>
</label>

<br><br>
<button type="submit">Submit</button>

</form>

<script>
function checkServices(event) {
  const perm = document.getElementById("perm").checked;
  const color = document.getElementById("color").checked;
  const hairstyle = document.getElementById("hairstyle").checked;
  const waxing = document.getElementById("waxing").checked;
  const nails = document.getElementById("nails").checked;

   if (waxing) {
    window.location.href = "{% url 'waxing_waiver' %}"; 
    return false;
  }
  if (!perm && !color && !hairstyle && !waxing && !nails) {
    alert("Please select at least one service before submitting.");
    return false;
  }

  return true;
}
</script>


</body>
</html>
